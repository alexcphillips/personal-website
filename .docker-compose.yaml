version: "3.9"

services:
    client:
        build: ./client
        ports:
            - "5173:5173"
        volumes:
            - ./client:/app
        environment:
            - VITE_API_URL=http://localhost:3000
        depends_on:
            - server

    server:
        build: ./server
        ports:
            - "3000:3000"
        volumes:
            - ./server:/app
        environment:
            - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/portfolio
            - REDIS_URL=redis://redis:6379
        depends_on:
            - postgres
            - redis

    postgres:
        image: postgres:15
        restart: always
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: portfolio
        volumes:
            - postgres-data:/var/lib/postgresql/data

    redis:
        image: redis:7
        restart: always
        ports:
            - "6379:6379"

volumes:
    postgres-data:
